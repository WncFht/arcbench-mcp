[project]
name = "arcbench-mcp"
version = "0.1.0"
description = "ARC-Bench MCP server + CLI：拉取提交 zip、查分数与榜单、对比实验结果"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9,<2",
    "httpx>=0.27",
]

[project.scripts]
arcbench-mcp = "arcbench_mcp.server:main"
arcbench = "arcbench_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arcbench_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
